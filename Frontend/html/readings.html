<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/readings.css">
</head>
<body>
    <div id="screenPremises">
    <h1>Мои помещения</h1>
    <div class="card" id="premisesList"></div>
</div>

<div id="screenMeters" class="hidden">
    <button id="backToPremises">← Назад</button>
    <h1 id="premiseTitle"></h1>
    <div class="card" id="metersList"></div>
</div>

<div id="screenForm" class="hidden">
    <button id="backToMeters">← Назад</button>
    <h1 id="meterTitle"></h1>
    <p id="lastValue"></p>
    <input type="number" id="value" placeholder="Показание">
    <label for="photo" class="photo-btn">📷 Фото счётчика</label>
    <input type="file" id="photo" accept="image/*" capture="environment" class="visually-hidden">
    <div id="photoPreview" class="photo-preview">превью фото</div>
    <button id="submitReading">Отправить</button>
</div>

<div id="toast" class="toast">
    <span id="toastIcon" class="toast-icon">✓</span>
    <span id="toastMessage">Показание сохранено</span>
</div>
<script src="../js/readings.js"></script>
</body>
</html>
